<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#56CCF2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Weather App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <header>
        <div class="header-top">
            <h1>Weather</h1>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">\uD83C\uDF19</button>
        </div>
        <div class="search-wrapper">
            <form id="search-form" role="search">
                <input
                    type="text"
                    id="city-input"
                    placeholder="Search city..."
                    autocomplete="off"
                    aria-label="City name"
                    role="combobox"
                    aria-expanded="false"
                    aria-controls="city-results"
                    aria-autocomplete="list"
                >
                <button type="submit">Search</button>
            </form>
            <ul id="city-results" class="city-results hidden" role="listbox"></ul>
        </div>
    </header>

    <main>
        <div id="loading" class="loading hidden">
            <span class="spinner"></span>
        </div>

        <div id="error" class="error hidden" role="alert"></div>

        <div class="dashboard">
            <!-- Current Weather Hero -->
            <section id="current-weather" class="card full-width hidden" aria-label="Current weather" data-animate></section>

            <!-- Hourly Forecast -->
            <section id="hourly-forecast" class="card full-width hidden" aria-label="Hourly forecast" data-animate></section>

            <!-- Daily Forecast -->
            <section id="daily-forecast" class="card full-width hidden" aria-label="7-day forecast" data-animate></section>

            <!-- Air Quality -->
            <section id="air-quality" class="card hidden" aria-label="Air quality" data-animate></section>

            <!-- Marine Conditions -->
            <section id="marine" class="card hidden" aria-label="Marine conditions" data-animate></section>

            <!-- Atmosphere Details -->
            <section id="atmosphere" class="card hidden" aria-label="Atmosphere" data-animate></section>

            <!-- Solar Radiation -->
            <section id="solar-radiation" class="card hidden" aria-label="Solar radiation" data-animate></section>

            <!-- Soil Conditions -->
            <section id="soil-conditions" class="card hidden" aria-label="Soil conditions" data-animate></section>
        </div>
    </main>

    <footer>
        <p>Powered by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></p>
    </footer>

    <script type="module" src="js/app.js"></script>
</body>
</html>
